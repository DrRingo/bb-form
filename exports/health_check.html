<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>health_check - Forms.md</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/formsmd/dist/css/formsmd.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #faf5ff 100%);
            margin: 0;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        #form-container {
            width: 100%;
            max-width: 680px;
            background: #ffffff;
            padding: 3rem 3.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px -10px rgba(0,0,0,0.12), 0 8px 16px -8px rgba(0,0,0,0.06);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        @media (max-width: 640px) {
            body { padding: 0; align-items: stretch; }
            #form-container { border-radius: 0; padding: 2rem 1.5rem; box-shadow: none; }
        }
    </style>
</head>
<body>
    <div id="form-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/formsmd/dist/js/formsmd.bundle.min.js"></script>
    <script>
        // Monkey-patch nunjucks.renderString to inject setVal helper
        const origRenderString = nunjucks.renderString;
        let reRenderQueue = new Set();
        let isReRendering = false;

        nunjucks.renderString = function(str, ctx) {
            if (ctx) {
                ctx.setVal = function(name, val) {
                    if (window.currentFormsmdInstance) {
                        const oldVal = window.currentFormsmdInstance.state.formData[name];
                        if (oldVal !== val) {
                            window.currentFormsmdInstance.state.formData[name] = val;
                            reRenderQueue.add(name);
                        }
                    }
                    return "";
                };
            }
            return origRenderString.call(this, str, ctx);
        };

        // Monkey-patch reRenderBindElems to process queue and prevent loops
        const origReRender = Formsmd.prototype.reRenderBindElems;
        Formsmd.prototype.reRenderBindElems = function(name) {
            if (isReRendering) {
                origReRender.call(this, name);
                return;
            }
            isReRendering = true;
            try {
                origReRender.call(this, name);
                // Flush the queue of modified calculated variables
                while (reRenderQueue.size > 0) {
                    const queue = Array.from(reRenderQueue);
                    reRenderQueue.clear();
                    for (const v of queue) {
                        origReRender.call(this, v);
                    }
                }
            } finally {
                isReRendering = false;
            }
        };

        // Monkey-patch setFormDataToState to also flush the queue
        const origSetFormDataToState = Formsmd.prototype.setFormDataToState;
        Formsmd.prototype.setFormDataToState = function() {
            origSetFormDataToState.call(this);
            if (!isReRendering) {
                isReRendering = true;
                try {
                    while (reRenderQueue.size > 0) {
                        const queue = Array.from(reRenderQueue);
                        reRenderQueue.clear();
                        for (const v of queue) {
                            origReRender.call(this, v);
                        }
                    }
                } finally {
                    isReRendering = false;
                }
            }
        };

        const template = `
#! id = health_check

-> start -> Bắt đầu
# Kiểm tra rủi ro tim mạch
Form mẫu minh hoạ tính năng Import Formula.
---

:::
{% set risk_score = 0.0 %}{{ setVal("risk_score", risk_score) }}
{% set risk_category = 'unknown' %}{{ setVal("risk_category", risk_category) }}
:::

ho_ten* = TextInput(
  | question = Họ và tên
)

tuoi* = NumberInput(
  | question = Tuổi
)

gioi_tinh* = SelectBox(
  | question = Giới tính
  | options = Nam, Nữ
)

bmi* = NumberInput(
  | question = Chỉ số BMI
)

hut_thuoc* = SelectBox(
  | question = Bạn có hút thuốc không?
  | options = Có, Không
)

hdl* = NumberInput(
  | question = Chỉ số HDL (cholesterol tốt)
)
::: [{$ hdl $}]
{% set risk_score = cardio_risk.calc_risk(tuoi, gioi_tinh, bmi, (true if hut_thuoc == "Có" else false), hdl) %}{{ setVal("risk_score", risk_score) }}
{% set risk_category = cardio_risk.risk_category(risk_score) %}{{ setVal("risk_category", risk_category) }}
:::

::: [{$ risk_category $}]
{% if (risk_category == 'high' or risk_category == 'very-high') %}
thong_bao_nguy_hiem = TextInput(
  | question = ⚠️ CẢNH BÁO: Rủi ro tim mạch của bạn ở mức CAO. Hãy đến bác sĩ!
)
{% endif %}
:::

::: [{$ risk_category $}]
{% if risk_category == 'low' %}
thong_bao_an_toan = TextInput(
  | question = ✅ Tốt lắm: Rủi ro tim mạch của bạn ở mức THẤP.
)
{% endif %}
:::
---
-> end
# Cảm ơn bạn!
Thông tin đăng ký của bạn đã được ghi nhận.
`;
        const formsmd = new Formsmd(template, document.getElementById("form-container"), {
            colorScheme: "light"
        });
        window.currentFormsmdInstance = formsmd;
        formsmd.init();
    </script>
</body>
</html>
