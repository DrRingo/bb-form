<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>health_check - Forms.md</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/formsmd/dist/css/formsmd.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #faf5ff 100%);
            margin: 0;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        #form-container {
            width: 100%;
            max-width: 680px;
            background: #ffffff;
            padding: 3rem 3.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px -10px rgba(0,0,0,0.12), 0 8px 16px -8px rgba(0,0,0,0.06);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        @media (max-width: 640px) {
            body { padding: 0; align-items: stretch; }
            #form-container { border-radius: 0; padding: 2rem 1.5rem; box-shadow: none; }
        }
    </style>
</head>
<body>
    <div id="form-container"></div>

    <!-- Custom JS functions (defined by :import in bb-form) -->
    <!-- Add any external window.namespace.functionName definitions here -->
    <script>
        // Placeholder: bb-form detected external :call references.
        // Define your custom functions here if needed:
        // window.my_namespace = { my_function: function(a, b) { ... } };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/formsmd/dist/js/formsmd.bundle.min.js"></script>
    <script>
        const template = `
#! id = health_check

-> start -> Bắt đầu
# Kiểm tra rủi ro tim mạch
Form mẫu minh hoạ tính năng Import Formula.
---

:::
{% set risk_score = 0.0 %}
{% set risk_category = 'unknown' %}
:::

ho_ten* = TextInput(
  | question = Họ và tên
)

tuoi* = NumberInput(
  | question = Tuổi
)

gioi_tinh* = SelectBox(
  | question = Giới tính
  | choices = Nam, Nữ
)

bmi* = NumberInput(
  | question = Chỉ số BMI
)

hut_thuoc* = SelectBox(
  | question = Bạn có hút thuốc không?
  | choices = Có, Không
)

hdl* = NumberInput(
  | question = Chỉ số HDL (cholesterol tốt)
)
::: [{$ hdl $}]
{% set risk_score = cardio_risk.calc_risk(tuoi, gioi_tinh, bmi, ((hut_thuoc == "Có") ? true : false), hdl) %}
{% set risk_category = cardio_risk.risk_category(risk_score) %}
:::

::: [{$ risk_category $}]
{% if ((risk_category == 'high') or (risk_category == 'very-high')) %}
thong_bao_nguy_hiem = TextInput(
  | question = ⚠️ CẢNH BÁO: Rủi ro tim mạch của bạn ở mức CAO. Hãy đến bác sĩ!
)
{% endif %}
:::

::: [{$ risk_category $}]
{% if (risk_category == 'low') %}
thong_bao_an_toan = TextInput(
  | question = ✅ Tốt lắm: Rủi ro tim mạch của bạn ở mức THẤP.
)
{% endif %}
:::
---
-> end
# Cảm ơn bạn!
Thông tin đăng ký của bạn đã được ghi nhận.
`;
        const formsmd = new Formsmd(template, document.getElementById("form-container"), {
            colorScheme: "light"
        });
        formsmd.init();
    </script>
</body>
</html>
