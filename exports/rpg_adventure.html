<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rpg_adventure - Forms.md</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/formsmd/dist/css/formsmd.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #faf5ff 100%);
            margin: 0;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        #form-container {
            width: 100%;
            max-width: 680px;
            background: #ffffff;
            padding: 3rem 3.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px -10px rgba(0,0,0,0.12), 0 8px 16px -8px rgba(0,0,0,0.06);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        @media (max-width: 640px) {
            body { padding: 0; align-items: stretch; }
            #form-container { border-radius: 0; padding: 2rem 1.5rem; box-shadow: none; }
        }
    </style>
</head>
<body>
    <div id="form-container"></div>

    <!-- Custom JS functions (defined by :import in bb-form) -->
    <!-- Add any external window.namespace.functionName definitions here -->
    <script>
        // Placeholder: bb-form detected external :call references.
        // Define your custom functions here if needed:
        // window.my_namespace = { my_function: function(a, b) { ... } };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/formsmd/dist/js/formsmd.bundle.min.js"></script>
    <script>
        const template = `
#! id = rpg_adventure

-> start -> Bắt đầu
# Vụ Án Mất Tích
Bạn là thám tử. Mọi lựa chọn đều dẫn đến những câu hỏi khác nhau.
---

ten_tham_tu* = TextInput(
  | question = Tên của bạn là gì, thám tử?
)

do_nghe = ChoiceInput(
  | question = Bạn mang theo dụng cụ gì khi tới hiện trường?
  | choices = Kính lúp, Đèn pin, Súng, Găng tay cao su
  | multiple = true
)

hanh_dong_dau_tien* = SelectBox(
  | question = Cánh cửa căn nhà gỗ đang hé mở. Bạn làm gì?
  | choices = Đạp cửa xông vào, Gõ cửa cẩn thận, Nhìn qua khe cửa
)

::: [{$ do_nghe hanh_dong_dau_tien $}]
{% if ((hanh_dong_dau_tien == "Đạp cửa xông vào") and do_nghe contains "Súng") %}
rut_sung* = SelectBox(
  | question = Bên trong tối om, có tiếng động lạ! Bạn có rút súng không?
  | choices = Có, Không
)
{% endif %}
:::

::: [{$ do_nghe hanh_dong_dau_tien $}]
{% if ((hanh_dong_dau_tien == "Đạp cửa xông vào") and not (do_nghe contains "Súng")) %}
bi_tan_cong* = SelectBox(
  | question = Bạn không có súng! Một bóng đen lao ra. Bạn làm gì?
  | choices = Đỡ đòn, Bỏ chạy
)
{% endif %}
:::

::: [{$ do_nghe hanh_dong_dau_tien $}]
{% if ((hanh_dong_dau_tien == "Nhìn qua khe cửa") and do_nghe contains "Kính lúp") %}
quan_sat_bang_kinh* = SelectBox(
  | question = Dùng kính lúp, bạn phát hiện một vết máu nhỏ trên nắm đấm cửa. Bạn:
  | choices = Lấy mẫu máu, Bỏ qua, đi tiếp
)
{% endif %}
:::

::: [{$ bi_tan_cong hanh_dong_dau_tien quan_sat_bang_kinh rut_sung $}]
{% if ((bi_tan_cong == "Đỡ đòn") or (rut_sung == "Có") or (quan_sat_bang_kinh == "Lấy mẫu máu") or (hanh_dong_dau_tien == "Gõ cửa cẩn thận")) %}
ket_luan* = SelectBox(
  | question = Tóm lại, bạn nghĩ thủ phạm là ai?
  | choices = Người hầu, Quản gia, Một con thú hoang, Chưa đủ bằng chứng
)
{% endif %}
:::
---
-> end
# Cảm ơn bạn!
Thông tin đăng ký của bạn đã được ghi nhận.
`;
        const formsmd = new Formsmd(template, document.getElementById("form-container"), {
            colorScheme: "light"
        });
        formsmd.init();
    </script>
</body>
</html>
