<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bayesian_recruitment - Forms.md</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/formsmd/dist/css/formsmd.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #form-container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div id="form-container"></div>

    <script>
        window.cardio_risk = {
            calc_risk: function(age, gender, bmi, smoking, hdl) {
                let base = age * 0.49;
                let sex_adj = (gender === "Nam") ? 8.0 : 0.0;
                let bmi_adj = (bmi - 22) * 1.5;
                let smk_adj = smoking ? 12.0 : 0.0;
                let hdl_adj = hdl * (-0.8);
                return Math.min(100, Math.max(0, base + sex_adj + bmi_adj + smk_adj + hdl_adj));
            },
            risk_category: function(score) {
                if (score < 10) return 'low';
                if (score < 20) return 'moderate';
                if (score < 30) return 'high';
                return 'very-high';
            }
        };

        window.stan_result = {
            prob: 65,
            confidence: "Trung bình",
            lower_bound: 50,
            upper_bound: 80
        };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/formsmd/dist/js/formsmd.bundle.min.js"></script>
    <script>
        const template = `
#! id = bayesian_recruitment

-> start
# Bayesian Recruitment Engine (Phase 6)
Sử dụng Backend Stan để dự đoán khả năng trúng tuyển của ứng viên kèm theo mức độ bất định (uncertainty).
---

{% set stan_result = {} %}

experience* = NumberInput(
  | question = Số năm kinh nghiệm làm việc?
)


test_score* = NumberInput(
  | question = Điểm bài test kỹ năng (1-10)
)
::: [{$ test_score $}]
{% set stan_result = stan.run_stan_model(experience, test_score) %}
:::


::: [{$ stan_result $}]
{% if (stan_result.'prob' < 50) %}
⚠️ CẢNH BÁO CAO: Khả năng ứng viên này phù hợp với công ty chỉ là {{ stan_result.'prob' }}%. (Mức độ tin cậy {{ stan_result.'confidence' }}: dao động từ {{ stan_result.'lower_bound' }}% đến {{ stan_result.'upper_bound' }}%)
{% else %}
✅ TIỀM NĂNG: Xác suất ứng viên này thành công là {{ stan_result.'prob' }}%. (Mức độ tin cậy {{ stan_result.'confidence' }}: dao động từ {{ stan_result.'lower_bound' }}% đến {{ stan_result.'upper_bound' }}%)
{% endif %}
:::


---
-> end
# Cảm ơn bạn!
Thông tin đăng ký của bạn đã được ghi nhận.
`;
        const formsmd = new Formsmd(template, document.getElementById("form-container"));
        formsmd.init();
    </script>
</body>
</html>
