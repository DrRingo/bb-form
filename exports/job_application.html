<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>job_application - Forms.md</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/formsmd/dist/css/formsmd.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #faf5ff 100%);
            margin: 0;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        #form-container {
            width: 100%;
            max-width: 680px;
            background: #ffffff;
            padding: 3rem 3.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px -10px rgba(0,0,0,0.12), 0 8px 16px -8px rgba(0,0,0,0.06);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        @media (max-width: 640px) {
            body { padding: 0; align-items: stretch; }
            #form-container { border-radius: 0; padding: 2rem 1.5rem; box-shadow: none; }
        }
    </style>
</head>
<body>
    <div id="form-container"></div>

    <!-- Custom JS functions (defined by :import in bb-form) -->
    <!-- Add any external window.namespace.functionName definitions here -->
    <script>
        // Placeholder: bb-form detected external :call references.
        // Define your custom functions here if needed:
        // window.my_namespace = { my_function: function(a, b) { ... } };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/formsmd/dist/js/formsmd.bundle.min.js"></script>
    <script>
        const template = `
#! id = job_application

-> start -> Bắt đầu
# Hệ thống Phân Tích Kỹ Năng Ứng Viên (Matrix Score)
Form sử dụng thư viện tính toán ma trận bằng Clojure (.clj) để phân loại ứng viên.
---

:::
{% set analysis_result = {} %}
{% set recommended_role = "Đang phân tích" %}
{% set best_score = 0 %}
:::

ho_ten* = TextInput(
  | question = Họ và tên ứng viên
)

ui_score* = NumberInput(
  | question = 1. Tự đánh giá kỹ năng UI/UX (0-10)
)

sys_score* = NumberInput(
  | question = 2. Tự đánh giá kỹ năng System Design (0-10)
)

algo_score* = NumberInput(
  | question = 3. Tự đánh giá kỹ năng Thuật Toán (0-10)
)

devops_score* = NumberInput(
  | question = 4. Tự đánh giá kỹ năng DevOps/Deployment (0-10)
)
::: [{$ devops_score $}]
{% set analysis_result = score.analyze_candidate(ui_score, sys_score, algo_score, devops_score) %}
{% set recommended_role = score.get_recommended_role(analysis_result) %}
{% set best_score = score.get_best_score(analysis_result) %}
:::

::: [{$ best_score $}]
{% if best_score < 50 %}
⚠️ Rất tiếc, điểm cao nhất của bạn quá thấp để phù hợp với bất kỳ vị trí nào.
{% endif %}
:::

::: [{$ best_score $}]
{% if best_score >= 50 %}
🎉 CHÚC MỪNG! Dựa trên ma trận năng lực, vị trí phù hợp nhất với bạn là {$ recommended_role $} với số điểm {$ best_score $}/100.
{% endif %}
:::
---
-> end
# Cảm ơn bạn!
Thông tin đăng ký của bạn đã được ghi nhận.
`;
        const formsmd = new Formsmd(template, document.getElementById("form-container"), {
            colorScheme: "light"
        });
        formsmd.init();
    </script>
</body>
</html>
