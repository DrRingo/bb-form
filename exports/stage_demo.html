<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stage_demo - Forms.md</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/formsmd/dist/css/formsmd.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #faf5ff 100%);
            margin: 0;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        #form-container {
            width: 100%;
            max-width: 680px;
            background: #ffffff;
            padding: 3rem 3.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px -10px rgba(0,0,0,0.12), 0 8px 16px -8px rgba(0,0,0,0.06);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        @media (max-width: 640px) {
            body { padding: 0; align-items: stretch; }
            #form-container { border-radius: 0; padding: 2rem 1.5rem; box-shadow: none; }
        }
    </style>
</head>
<body>
    <div id="form-container"></div>

    <!-- Custom JS functions (defined by :import in bb-form) -->
    <!-- Add any external window.namespace.functionName definitions here -->
    <script>
        // Placeholder: bb-form detected external :call references.
        // Define your custom functions here if needed:
        // window.my_namespace = { my_function: function(a, b) { ... } };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/formsmd/dist/js/formsmd.bundle.min.js"></script>
    <script>
        const template = `
#! id = stage_demo

-> start -> Bắt đầu
# Hệ thống Xét Duyệt Hồ Sơ (Đa Vòng)
Minh hoạ tính năng Stages, Hidden Variables và Actions
---

:::
{% set diem_tong = 0 %}
{% set trang_thai = "Đang xét duyệt" %}
:::

:::
<p class="text-muted">📢 Chào mừng bạn đến với VÒNG 1: Đánh giá Kinh Nghiệm!</p>
:::
ho_ten* = TextInput(
  | question = Họ và tên ứng viên
)

kinh_nghiem* = NumberInput(
  | question = Số năm kinh nghiệm làm việc
)

::: [{$ kinh_nghiem $}]
{% set diem_kinh_nghiem = (kinh_nghiem * 10) %}
:::

::: [{$ diem_kinh_nghiem $}]
{% if diem_kinh_nghiem >= 50 %}
cau_hoi_phu_chuyen_gia* = TextInput(
  | question = Bạn có kinh nghiệm > 50 điểm. Hãy kể tên 1 dự án lớn nhất bạn từng làm?
)
{% endif %}
:::
:::
{% set diem_tong = (diem_tong + diem_kinh_nghiem) %}
<p class="text-muted">📢 Đã cộng điểm Vòng 1 vào Tổng điểm!</p>
:::
---

:::
<p class="text-muted">📢 Bạn đã bước sang VÒNG 2: Bài test Chuyên môn.</p>
:::
cau_hoi_thu_thach* = SelectBox(
  | question = Ngôn ngữ nào chạy trên JVM mà không phải Java?
  | options = Python, Clojure, Go, Rust
)
::: [{$ cau_hoi_thu_thach $}]
{% set diem_tong = (diem_tong + (50 if cau_hoi_thu_thach == "Clojure" else 0)) %}
:::

::: [{$ diem_tong $}]
{% if diem_tong < 100 %}
thong_bao_rot* = SelectBox(
  | question = ⚠️ Rất tiếc, Tổng điểm của bạn quá thấp để đậu vòng này.
  | options = Tôi đồng ý
)
{% endif %}
:::
:::
{% set trang_thai = ("Đã Đậu" if diem_tong >= 100 else "Đã Rớt") %}
<p class="text-muted">📢 Hoàn tất đánh giá Vòng 2!</p>
:::
---
-> end
# Cảm ơn bạn!
Tổng điểm của bạn: **{$ diem_tong $}**
Trạng thái: **{$ trang_thai $}**
Thông tin đăng ký của bạn đã được ghi nhận.
`;
        const formsmd = new Formsmd(template, document.getElementById("form-container"), {
            colorScheme: "light"
        });
        formsmd.init();
    </script>
</body>
</html>
