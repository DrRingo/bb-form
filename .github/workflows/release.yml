name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$TAG" >> $GITHUB_OUTPUT
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "Build version: $TAG"

      - name: Install Babashka
        run: |
          curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
          chmod +x install
          sudo ./install
          bb --version

      - name: Build uberscript
        run: |
          mkdir -p dist
          bb uberscript dist/bb-form.clj -m com.drbinhthanh.bb-form
          echo "Uberscript size: $(du -sh dist/bb-form.clj | cut -f1)"

      - name: Create release packages
        run: bash scripts/build.sh ${{ steps.version.outputs.VERSION }}

      - name: Generate SHA256 checksums
        run: |
          cd release
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "bb-form v${{ steps.version.outputs.VERSION }}"
          body: |
            ## bb-form v${{ steps.version.outputs.VERSION }}

            ### Cài đặt

            **Homebrew (macOS/Linux):**
            ```bash
            brew tap drringo/bb-form https://github.com/drringo/bb-form
            brew install bb-form
            ```

            **Scoop (Windows):**
            ```powershell
            scoop bucket add drringo https://github.com/drringo/bb-form
            scoop install bb-form
            ```

            **Tải thủ công:** Chọn file phù hợp với nền tảng của bạn ở phần Assets bên dưới.

            ### Yêu cầu
            - [Babashka](https://babashka.org/) — có thể cài tự động qua Homebrew/Scoop
            - [Charm Gum](https://github.com/charmbracelet/gum) — có thể cài tự động qua Homebrew/Scoop
          files: |
            release/bb-form-linux-x86_64.tar.gz
            release/bb-form-macos-x86_64.tar.gz
            release/bb-form-macos-arm64.tar.gz
            release/bb-form-windows-x86_64.zip
            release/checksums.txt
          generate_release_notes: false

      - name: Update Homebrew formula SHA256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          SHA_LINUX=$(sha256sum release/bb-form-linux-x86_64.tar.gz | cut -d' ' -f1)
          SHA_MACOS_X86=$(sha256sum release/bb-form-macos-x86_64.tar.gz | cut -d' ' -f1)
          SHA_MACOS_ARM=$(sha256sum release/bb-form-macos-arm64.tar.gz | cut -d' ' -f1)

          sed -i \
            -e "s|version \".*\"|version \"$VERSION\"|g" \
            -e "/bb-form-linux-x86_64/{ n; s|sha256 \".*\"|sha256 \"$SHA_LINUX\"| }" \
            -e "/bb-form-macos-x86_64/{ n; s|sha256 \".*\"|sha256 \"$SHA_MACOS_X86\"| }" \
            -e "/bb-form-macos-arm64/{ n; s|sha256 \".*\"|sha256 \"$SHA_MACOS_ARM\"| }" \
            Formula/bb-form.rb

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add Formula/bb-form.rb bucket/bb-form.json
          git commit -m "chore: update formula/manifest to v$VERSION [skip ci]" || true
          git push origin HEAD:main || true

      - name: Update Scoop manifest
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          SHA_WIN=$(sha256sum release/bb-form-windows-x86_64.zip | cut -d' ' -f1)
          URL="https://github.com/drringo/bb-form/releases/download/v${VERSION}/bb-form-windows-x86_64.zip"

          python3 -c "
          import json, sys
          with open('bucket/bb-form.json') as f:
              m = json.load(f)
          m['version'] = '$VERSION'
          m['url'] = '$URL'
          m['hash'] = 'sha256:$SHA_WIN'
          with open('bucket/bb-form.json', 'w') as f:
              json.dump(m, f, indent=2, ensure_ascii=False)
              f.write('\n')
          "

          git add bucket/bb-form.json
          git commit -m "chore: update scoop manifest to v$VERSION [skip ci]" || true
          git push origin HEAD:main || true
